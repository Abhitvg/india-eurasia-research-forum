name: 🏗️ CI Build Check

on:
  push:
    branches:
      - main

jobs:
  build-check:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Install dependencies
        run: npm ci

      - name: 🏗️ Build Project
        run: npm run build

